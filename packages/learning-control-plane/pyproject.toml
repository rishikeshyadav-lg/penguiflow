[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-control-plane"
version = "0.1.0"
description = "Framework-agnostic learning control plane: mine agent traces, draft and gate advisory skills, deliver them back."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "PenguiFlow Team"},
]
dependencies = []

[project.optional-dependencies]
mlflow = [
    "mlflow==3.12.0",
]
penguiflow = [
    "penguiflow>=3.12.0",
]
langchain = [
    "langchain>=1.4",
    "databricks-langchain>=0.20.0",
]
dev = [
    "mypy>=1.8",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.2",
]

[project.urls]
Homepage = "https://github.com/hurtener/penguiflow"

[tool.setuptools]
packages = { find = { include = ["learning_control_plane*"] } }
license-files = ["LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["learning_control_plane"]
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
